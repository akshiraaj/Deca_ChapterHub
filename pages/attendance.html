<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance — DECA Chapter Hub</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<div class="page">
  <p class="eyebrow">Your Record</p>
  <h1 class="title">Attendance</h1>
  <p class="lede">Every meeting and event you've been marked for. Execs log this from the exec dashboard.</p>

  <table class="data hidden" id="att-table">
    <thead><tr><th>Event</th><th>Status</th><th>Date</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty hidden" id="empty">
    <div class="empty-title">No attendance logged yet</div>
    <p class="muted">Once an exec marks you present at an event, it'll show up here.</p>
  </div>
</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import { auth, db, collection, getDocs, query, orderBy, renderNav, watchAuth, getUserProfile, fmtDate, requireAuth } from "../js/app.js";

const user = await requireAuth();
renderNav("/pages/attendance.html");
watchAuth(()=>{});

(async ()=>{
  const table = document.getElementById("att-table");
  const empty = document.getElementById("empty");

  const profile = await getUserProfile(user.uid);
  const name = profile ? profile.name : user.email;

  const snap = await getDocs(query(collection(db, "attendance"), orderBy("createdAt","desc")));
  const rows = [];
  snap.forEach(d=>{
    const r = d.data();
    if(r.name === name){
      rows.push(`<tr><td>${r.event}</td><td><span class="pill pill-${r.status}">${r.status}</span></td><td>${fmtDate(r.createdAt)}</td></tr>`);
    }
  });

  if(rows.length){
    table.classList.remove("hidden");
    table.querySelector("tbody").innerHTML = rows.join("");
  } else {
    empty.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
