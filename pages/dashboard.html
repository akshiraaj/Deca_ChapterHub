<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — DECA Chapter Hub</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="tint" style="position:fixed;top:0;left:0;right:0;height:420px;pointer-events:none;z-index:0;"></div>

<div class="page" style="position:relative;z-index:1;">
  <div id="greeting" style="display:flex;align-items:center;gap:16px;margin-bottom:28px;"></div>
  <div id="widgets" style="display:flex;flex-direction:column;gap:12px;"></div>
</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import {
  db, collection, getDocs, query, orderBy, where, addDoc, serverTimestamp,
  renderNav, watchAuth, requireAuth, getUserProfile, fmtDate, showMsg, CLUSTER_META
} from "/js/app.js";

const user = await requireAuth();
renderNav();
watchAuth(()=>{});

let profile;
try {
  profile = await getUserProfile(user.uid);
} catch(err){ console.error("FAILED: getUserProfile", err); }

if(!profile){
  document.getElementById("greeting").innerHTML = `
    <div>
      <h1 class="title" style="margin:0;font-size:28px;">Welcome</h1>
      <p class="muted">Profile not found — try signing out and back in.</p>
    </div>`;
  document.getElementById("widgets").innerHTML = `<p class="muted">No cluster data found. Contact your exec.</p>`;
  throw new Error("No profile");
}

const cluster = profile.cluster;
const meta = CLUSTER_META[cluster] || { color: "#4C6FFF", badge: "", nickname: "Member" };

// tint
document.getElementById("tint").style.background =
  `radial-gradient(900px 400px at 50% 0%, ${meta.color}55, transparent 65%)`;

// greeting
document.getElementById("greeting").innerHTML = `
  <div style="width:72px;height:72px;border-radius:12px;background:${meta.color}22;border:1px solid ${meta.color}66;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:6px;">
    <img src="${meta.badge}" style="width:100%;height:100%;object-fit:contain;" alt="${cluster}" onerror="this.style.display='none'">
  </div>
  <div>
    <h1 class="title" style="margin:0;font-size:28px;">Hello, ${meta.nickname}</h1>
    <p class="eyebrow" style="margin:4px 0 0;color:${meta.color};">${cluster}</p>
  </div>
`;

// widget builder
function widgetCard(title, teaserHtml, bodyHtml){
  const el = document.createElement("div");
  el.className = "card";
  el.style.cssText = "padding:0;overflow:hidden;";
  el.innerHTML = `
    <div class="w-head" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;">
      <div>
        <p style="font-weight:700;font-size:15px;color:#fff;margin:0;">${title}</p>
        <p class="muted" style="margin:3px 0 0;font-size:13px;">${teaserHtml}</p>
      </div>
      <span class="w-chev" style="color:var(--slate-dim);font-size:18px;">▾</span>
    </div>
    <div class="w-body hidden" style="padding:0 20px 20px;border-top:1px solid var(--border);">${bodyHtml}</div>
  `;
  el.querySelector(".w-head").addEventListener("click", ()=>{
    el.querySelector(".w-body").classList.toggle("hidden");
    el.querySelector(".w-chev").textContent =
      el.querySelector(".w-body").classList.contains("hidden") ? "▾" : "▴";
  });
  return el;
}

const widgetsEl = document.getElementById("widgets");

// ---- Leaderboard ----
const pointsSnap = await getDocs(collection(db, "points"));
const totals = {};
pointsSnap.forEach(d=>{
  const p = d.data();
  if(p.cluster) totals[p.cluster] = (totals[p.cluster]||0) + (Number(p.points)||0);
});
const ranked = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
const myRank = ranked.findIndex(([n])=>n===cluster)+1;
const myPts = totals[cluster]||0;

const boardRows = ranked.length ? ranked.map(([n,pts],i)=>`
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-family:var(--display);font-size:20px;font-weight:800;color:${n===cluster?meta.color:'var(--slate-dim)'};">${i+1}</span>
      <span style="font-size:13.5px;color:${n===cluster?'#fff':'var(--slate)'};font-weight:${n===cluster?700:400};">${n}</span>
    </div>
    <span style="font-family:var(--mono);font-size:13px;color:${n===cluster?'#fff':'var(--slate)'};">${pts} pts</span>
  </div>
`).join("") : `<p class="muted" style="padding-top:12px;">No points logged yet.</p>`;

widgetsEl.appendChild(widgetCard(
  "Leaderboard",
  myRank ? `Your cluster is ranked <strong style="color:#fff;">${myRank} of ${ranked.length}</strong> &mdash; ${myPts} pts` : "No points logged yet",
  `<div style="padding-top:4px;">${boardRows}</div>`
));

// ---- Spotlights ----
const spotSnap = await getDocs(query(collection(db,"spotlights"),orderBy("createdAt","desc")));
let spotHtml = "";
let spotCount = 0;
spotSnap.forEach(d=>{
  const s = d.data();
  spotCount++;
  spotHtml += `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <strong style="color:#fff;font-size:13.5px;">★ ${s.name}</strong>
      <p class="muted" style="margin:4px 0 0;font-size:13px;">${s.note}</p>
      <p class="muted" style="margin:4px 0 0;font-size:11px;">${fmtDate(s.createdAt)}</p>
    </div>`;
});
widgetsEl.appendChild(widgetCard(
  "Spotlights",
  spotCount ? `${spotCount} member${spotCount===1?"":"s"} featured` : "No spotlights yet",
  spotHtml || `<p class="muted" style="padding-top:12px;">No spotlights yet.</p>`
));

// ---- Case feedback ----
const memberName = profile.name || user.email;
let cfSnap;
try {
  cfSnap = await getDocs(query(
    collection(db,"casefeedback"),
    where("name","==",memberName)
  ));
} catch(err){ console.error("FAILED: casefeedback", err); }

let cfHtml = "";
let cfCount = 0;
if(cfSnap) cfSnap.forEach(d=>{
  const f = d.data();
  cfCount++;
  cfHtml += `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong style="color:#fff;font-size:13.5px;">${f.event}</strong>
        <span class="pill pill-excused">${f.grade}</span>
      </div>
      <p class="muted" style="margin:6px 0 0;font-size:13px;line-height:1.5;">${f.feedback}</p>
      <p class="muted" style="margin:4px 0 0;font-size:11px;">${fmtDate(f.createdAt)}</p>
    </div>`;
});
widgetsEl.appendChild(widgetCard(
  "Case feedback",
  cfCount ? `${cfCount} note${cfCount===1?"":"s"} from your execs` : "No feedback yet",
  cfHtml || `<p class="muted" style="padding-top:12px;">No feedback yet — check back after your first case study.</p>`
));

// ---- Send feedback ----
widgetsEl.appendChild(widgetCard(
  "Send feedback",
  `Goes straight to your ${cluster} execs`,
  `
    <div style="padding-top:12px;">
      <div id="fb-msg" class="msg"></div>
      <div class="field">
        <label for="fb-message">Your message</label>
        <input type="text" id="fb-message" placeholder="Question, idea, or feedback...">
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <input type="checkbox" id="fb-anon" style="width:auto;">
        <label for="fb-anon" style="font-size:13px;color:var(--slate);margin:0;">Submit anonymously</label>
      </div>
      <button class="btn" id="fb-submit" style="background:${meta.color};">Submit</button>
    </div>
  `
));

document.getElementById("fb-submit").addEventListener("click", async ()=>{
  const msgEl = document.getElementById("fb-msg");
  const message = document.getElementById("fb-message").value.trim();
  const anonymous = document.getElementById("fb-anon").checked;
  if(!message){ showMsg(msgEl, "Please type a message first.", "error"); return; }
  try{
    await addDoc(collection(db,"feedback"),{
      message, anonymous,
      name: anonymous ? "" : memberName,
      cluster, createdAt: serverTimestamp()
    });
    showMsg(msgEl, "Sent to your execs.", "success");
    document.getElementById("fb-message").value = "";
  } catch(err){
    showMsg(msgEl, err.message.replace("Firebase: ",""), "error");
  }
});
</script>
</body>
</html>
