<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — DECA Chapter Hub</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .d-card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 16px; }
  .d-card-wide { grid-column: span 2; }
  .d-label { font-family: var(--mono); font-size: 10px; color: var(--slate); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
  .d-num { font-family: var(--display); font-weight: 800; font-size: 36px; color: #fff; line-height: 1; margin: 0; }
  .d-field { width: 100%; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--ink); font-size: 13px; padding: 9px 10px; box-sizing: border-box; margin-bottom: 8px; font-family: var(--body); }
  .d-field:focus { outline: none; border-color: var(--royal); }
  .d-btn { border: none; border-radius: var(--radius); color: #fff; font-weight: 700; font-size: 12.5px; padding: 10px 18px; cursor: pointer; font-family: var(--body); }
  .d-btn-outline { background: transparent; border: 1.5px solid var(--border-strong); color: var(--ink); border-radius: var(--radius); font-size: 11.5px; padding: 7px 13px; cursor: pointer; font-family: var(--body); }
  .d-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .d-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="tint" style="position:fixed;top:0;left:0;right:0;height:420px;pointer-events:none;z-index:0;"></div>

<div class="page" style="position:relative;z-index:1;">

  <!-- HEADER -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <div style="display:flex;align-items:center;gap:14px;" id="greeting"></div>
    <button class="d-btn-outline" id="logout-btn">Log out</button>
  </div>

  <!-- GRID -->
  <div class="d-grid" id="widgets"></div>

</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import {
  db, doc, setDoc, collection, getDocs, query, orderBy, where, addDoc, serverTimestamp,
  renderNav, watchAuth, requireAuth, getUserProfile, fmtDate, showMsg, CLUSTER_META
} from "/js/app.js";

const user = await requireAuth();
renderNav();
watchAuth(()=>{});

let profile;
try {
  profile = await getUserProfile(user.uid);
} catch(err){ console.error("FAILED: getUserProfile", err); }

// If there's no profile doc for this UID (e.g. account was deleted/recreated,
// or the signup flow never wrote one), let the user create it here instead
// of dead-ending on an error.
if(!profile){
  profile = await createMissingProfile();
}

async function createMissingProfile(){
  const clusterOptions = Object.keys(CLUSTER_META);
  return new Promise((resolve)=>{
    document.getElementById("greeting").innerHTML = `
      <div>
        <h1 class="title" style="margin:0;font-size:28px;">Welcome</h1>
        <p class="muted">We couldn't find a profile for your account. Set it up below to continue.</p>
      </div>`;

    const widgetsEl = document.getElementById("widgets");
    const setupCard = document.createElement("div");
    setupCard.className = "d-card d-card-wide";
    setupCard.innerHTML = `
      <p class="d-label">Create your profile</p>
      <div id="setup-msg" class="msg"></div>
      <input type="text" class="d-field" id="setup-name" placeholder="Your name" value="${(user.displayName||"").replace(/"/g,'&quot;')}">
      <select class="d-field" id="setup-cluster">
        <option value="" disabled selected>Select your cluster</option>
        ${clusterOptions.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
      <button class="d-btn" id="setup-submit" style="background:#4C6FFF;">Create profile</button>
    `;
    widgetsEl.appendChild(setupCard);

    document.getElementById("setup-submit").addEventListener("click", async ()=>{
      const msgEl = document.getElementById("setup-msg");
      const name = document.getElementById("setup-name").value.trim();
      const cluster = document.getElementById("setup-cluster").value;
      if(!name){ showMsg(msgEl,"Please enter your name.","error"); return; }
      if(!cluster){ showMsg(msgEl,"Please select a cluster.","error"); return; }

      const newProfile = {
        name,
        cluster,
        email: user.email || "",
        createdAt: serverTimestamp()
      };

      try{
        await setDoc(doc(db,"users",user.uid), newProfile);
        setupCard.remove();
        resolve(newProfile);
      } catch(err){
        showMsg(msgEl, err.message.replace("Firebase: ",""), "error");
      }
    });
  });
}

const cluster = profile.cluster;
const meta = CLUSTER_META[cluster] || { color: "#4C6FFF", badge: "", nickname: "Member" };

// tint
document.getElementById("tint").style.background =
  `radial-gradient(900px 400px at 50% 0%, ${meta.color}40, transparent 65%)`;

// greeting
document.getElementById("greeting").innerHTML = `
  <div style="width:56px;height:56px;border-radius:10px;background:${meta.color}22;border:1px solid ${meta.color}55;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:4px;">
    <img src="${meta.badge}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'" alt="${cluster}">
  </div>
  <div>
    <h1 class="title" style="margin:0;font-size:26px;">Hello, ${meta.nickname}</h1>
    <p class="eyebrow" style="margin:4px 0 0;color:${meta.color};">${cluster}</p>
  </div>
`;

// logout
document.getElementById("logout-btn").addEventListener("click", async ()=>{
  const { auth, signOut } = await import("/js/app.js");
  await signOut(auth);
  window.location.href = "/index.html";
});

const widgetsEl = document.getElementById("widgets");

function card(extraClass, html){
  const el = document.createElement("div");
  el.className = "d-card" + (extraClass ? " " + extraClass : "");
  el.innerHTML = html;
  return el;
}

// ---- Leaderboard ----
const pointsSnap = await getDocs(collection(db,"points"));
const totals = {};
pointsSnap.forEach(d=>{
  const p = d.data();
  if(p.cluster) totals[p.cluster] = (totals[p.cluster]||0) + (Number(p.points)||0);
});
const ranked = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
const myRank = ranked.findIndex(([n])=>n===cluster)+1;
const myPts = totals[cluster]||0;

widgetsEl.appendChild(card("", `
  <p class="d-label">Your cluster rank</p>
  <p class="d-num">${myRank || "—"} <span style="font-size:14px;color:var(--slate);font-weight:400;">of ${ranked.length}</span></p>
  <p style="font-size:11px;color:${myRank===1?"#7FDBA6":"var(--slate)"};margin:6px 0 0;">${myPts} pts</p>
`));

// ---- Spotlights ----
const spotSnap = await getDocs(query(collection(db,"spotlights"),orderBy("createdAt","desc")));
let spotHtml = "";
spotSnap.forEach(d=>{
  const s = d.data();
  spotHtml += `
    <div class="d-row">
      <div>
        <p style="font-size:13px;font-weight:600;color:#fff;margin:0;">★ ${s.name}</p>
        <p style="font-size:12px;color:var(--slate);margin:2px 0 0;">${s.note}</p>
      </div>
      <span style="font-family:var(--mono);font-size:10px;color:var(--slate-dim);white-space:nowrap;margin-left:10px;">${fmtDate(s.createdAt)}</span>
    </div>`;
});
widgetsEl.appendChild(card("", `
  <p class="d-label">Spotlights</p>
  ${spotHtml || '<p class="muted" style="font-size:12px;">No spotlights yet.</p>'}
`));

// ---- Full leaderboard ----
const boardRows = ranked.length ? ranked.map(([n,pts],i)=>`
  <div class="d-row">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-family:var(--display);font-size:20px;font-weight:800;color:${n===cluster?meta.color:"var(--slate-dim)"};">${i+1}</span>
      <span style="font-size:13.5px;color:${n===cluster?"#fff":"var(--slate)"};font-weight:${n===cluster?700:400};">${n}</span>
    </div>
    <span style="font-family:var(--mono);font-size:13px;color:${n===cluster?"#fff":"var(--slate)"};">${pts} pts</span>
  </div>
`).join("") : `<p class="muted" style="font-size:12px;">No points logged yet.</p>`;

widgetsEl.appendChild(card("d-card-wide", `
  <p class="d-label">Leaderboard</p>
  ${boardRows}
`));

// ---- Case feedback ----
const memberName = profile.name || user.email;
let cfSnap;
try {
  cfSnap = await getDocs(query(
    collection(db,"casefeedback"),
    where("name","==",memberName)
  ));
} catch(err){ console.error("FAILED: casefeedback", err); }

let cfHtml = "";
if(cfSnap) cfSnap.forEach(d=>{
  const f = d.data();
  cfHtml += `
    <div class="d-row" style="align-items:flex-start;flex-direction:column;gap:6px;">
      <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
        <strong style="color:#fff;font-size:13.5px;">${f.event}</strong>
        <span class="pill pill-excused">${f.grade}</span>
      </div>
      <p style="font-size:12px;color:var(--slate);margin:0;line-height:1.5;">${f.feedback}</p>
      <span style="font-family:var(--mono);font-size:10px;color:var(--slate-dim);">${fmtDate(f.createdAt)}</span>
    </div>`;
});

widgetsEl.appendChild(card("", `
  <p class="d-label">Case feedback</p>
  ${cfHtml || '<p class="muted" style="font-size:12px;">No feedback yet.</p>'}
`));

// ---- Send feedback ----
widgetsEl.appendChild(card("", `
  <p class="d-label">Send feedback</p>
  <p style="font-size:12px;color:var(--slate);margin:0 0 10px;">Goes to your ${cluster} execs.</p>
  <div id="fb-msg" class="msg"></div>
  <input type="text" class="d-field" id="fb-message" placeholder="Question, idea, or feedback...">
  <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate);margin-bottom:10px;">
    <input type="checkbox" id="fb-anon" style="width:auto;"> Submit anonymously
  </label>
  <button class="d-btn" id="fb-submit" style="background:${meta.color};">Submit</button>
`));

document.getElementById("fb-submit").addEventListener("click", async ()=>{
  const msgEl = document.getElementById("fb-msg");
  const message = document.getElementById("fb-message").value.trim();
  const anonymous = document.getElementById("fb-anon").checked;
  if(!message){ showMsg(msgEl,"Please type a message first.","error"); return; }
  try{
    await addDoc(collection(db,"feedback"),{
      message, anonymous,
      name: anonymous ? "" : memberName,
      cluster, createdAt: serverTimestamp()
    });
    showMsg(msgEl,"Sent to your execs.","success");
    document.getElementById("fb-message").value = "";
  } catch(err){
    showMsg(msgEl, err.message.replace("Firebase: ",""), "error");
  }
});
</script>
</body>
</html>
