<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — DECA Chapter Hub</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<div class="page">
  <p class="eyebrow">Live Standings</p>
  <h1 class="title">Leaderboard</h1>
  <p class="lede">Rankings update as execs log points from meetings, competitions, and case studies.</p>

  <div class="board-wrap" id="board"></div>
  <div class="empty hidden" id="empty">
    <div class="empty-title">No points logged yet</div>
    <p class="muted">Once an exec awards the first points, standings will show up here.</p>
  </div>
</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import { db, collection, getDocs, renderNav, watchAuth, requireAuth } from "/js/app.js";

await requireAuth();
renderNav("/pages/leaderboard.html");
watchAuth(()=>{});

const boardEl = document.getElementById("board");
const emptyEl = document.getElementById("empty");

async function loadPoints(){
  const snap = await getDocs(collection(db, "points"));
  const clusterTotals = {};

  snap.forEach(d=>{
    const p = d.data();
    const pts = Number(p.points) || 0;
    if(p.cluster){
      clusterTotals[p.cluster] = (clusterTotals[p.cluster] || 0) + pts;
    }
  });

  return clusterTotals;
}

function renderBoard(rows){
  if(rows.length === 0){
    boardEl.classList.add("hidden");
    emptyEl.classList.remove("hidden");
    return;
  }
  boardEl.classList.remove("hidden");
  emptyEl.classList.add("hidden");
  boardEl.innerHTML = rows.map((r, i)=>{
    const rank = i+1;
    return `
      <div class="rank-row rank-${rank <= 3 ? rank : ""}">
        <div class="rank-num">${rank}</div>
        <div>
          <div class="rank-name">${r.name}</div>
        </div>
        <div class="rank-pts"><span class="label">Points</span>${r.points} pts</div>
      </div>
    `;
  }).join("");
}

async function render(){
  const clusterTotals = await loadPoints();
  const rows = Object.entries(clusterTotals)
    .sort((a,b)=>b[1]-a[1])
    .map(([name, points])=>({ name, points }));
  renderBoard(rows);
}

render();
</script>
</body>
</html>
