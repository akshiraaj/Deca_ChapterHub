<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exec Dashboard — DECA Chapter Hub</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .e-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .e-card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 16px; }
  .e-card-wide { grid-column: span 2; }
  .e-label { font-family: var(--mono); font-size: 10px; color: var(--slate); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
  .e-num { font-family: var(--display); font-weight: 800; font-size: 36px; color: #fff; line-height: 1; margin: 0; }
  .e-field { width: 100%; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--ink); font-size: 13px; padding: 9px 10px; box-sizing: border-box; margin-bottom: 8px; font-family: var(--body); }
  .e-field:focus { outline: none; border-color: var(--royal); }
  .e-select { width: 100%; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--ink); font-size: 13px; padding: 9px 10px; box-sizing: border-box; margin-bottom: 8px; font-family: var(--body); }
  .e-select option { background: #0B1220; }
  .e-btn { border: none; border-radius: var(--radius); color: #fff; font-weight: 700; font-size: 12.5px; padding: 10px 18px; cursor: pointer; font-family: var(--body); letter-spacing: .02em; }
  .e-btn-outline { background: transparent; border: 1.5px solid var(--border-strong); color: var(--ink); border-radius: var(--radius); font-size: 11.5px; padding: 7px 13px; cursor: pointer; font-family: var(--body); }
  .e-inbox-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .e-inbox-row:last-child { border-bottom: none; }
  .e-sw-dot { width: 22px; height: 22px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
  .e-sw-dot.active { border-color: rgba(255,255,255,0.6); }
  .e-pick-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: rgba(255,255,255,0.03); transition: border-color .15s, background .15s; }
  .e-pick-card:hover { background: rgba(255,255,255,0.06); }
  .e-pick-label { font-family: var(--display); font-size: 12px; font-weight: 700; color: #fff; text-align: center; margin: 0; }
  textarea.e-field { min-height: 80px; resize: vertical; }
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="tint" style="position:fixed;top:0;left:0;right:0;height:420px;pointer-events:none;z-index:0;"></div>

<div class="page" style="position:relative;z-index:1;">

  <!-- GATE -->
  <div id="gate-view">
    <div style="max-width:360px;margin:0 auto;">
      <p class="eyebrow">Exec only</p>
      <h1 class="title" style="font-size:32px;margin-bottom:8px;">Enter exec mode</h1>
      <p class="lede" style="margin-bottom:24px;">Enter your chapter exec code to continue.</p>
      <div class="card">
        <div id="gate-msg" class="msg"></div>
        <input class="e-field" type="password" id="gate-code" placeholder="Exec code">
        <button class="e-btn btn-crimson btn" style="width:100%;margin-top:4px;" id="gate-btn">Enter exec mode</button>
      </div>
    </div>
  </div>

  <!-- CLUSTER PICKER -->
  <div id="picker-view" class="hidden">
    <p class="eyebrow">Select your cluster</p>
    <h1 class="title" style="font-size:32px;margin-bottom:24px;">Which cluster are you managing?</h1>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:600px;" id="picker-grid"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view" class="hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div id="d-badge" style="width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:4px;">
          <img id="d-badge-img" style="width:100%;height:100%;object-fit:contain;" alt="">
        </div>
        <div>
          <h1 class="title" id="d-name" style="margin:0;font-size:26px;"></h1>
          <p class="eyebrow" id="d-label" style="margin:4px 0 0;"></p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="display:flex;gap:5px;" id="d-switcher"></div>
        <button class="btn btn-outline" id="exec-logout" style="font-size:12px;padding:7px 14px;margin-left:8px;">Log out</button>
      </div>
    </div>

    <div class="e-grid">

      <!-- Cluster total -->
      <div class="e-card">
        <p class="e-label">Cluster total</p>
        <p class="e-num" id="d-pts">— <span style="font-size:14px;color:var(--slate);font-weight:400;">pts</span></p>
        <p style="font-size:11px;margin:6px 0 0;" id="d-rank"></p>
        <button class="e-btn-outline" id="reset-pts-btn" style="margin-top:10px;">Reset to 0</button>
      </div>

      <!-- Spotlights -->
      <div class="e-card">
        <p class="e-label">Current spotlight</p>
        <div id="d-spot-current" style="margin-bottom:10px;"></div>
        <button class="e-btn-outline" id="spot-toggle">Post new spotlight</button>
        <div id="spot-form-wrap" class="hidden" style="margin-top:12px;">
          <div id="spot-msg" class="msg"></div>
          <input class="e-field" id="spot-name" placeholder="Member name">
          <input class="e-field" id="spot-note" placeholder="Why they're being featured">
          <button class="e-btn" id="spot-submit" style="background:var(--royal);">Post spotlight</button>
        </div>
      </div>

      <!-- Award points -->
      <div class="e-card">
        <p class="e-label">Award points</p>
        <div id="points-msg" class="msg"></div>
        <select class="e-select" id="pts-scope">
          <option value="cluster">Whole cluster</option>
          <option value="individual">Individual member</option>
        </select>
        <select class="e-select hidden" id="pts-member"></select>
        <input class="e-field" type="number" id="pts-amount" placeholder="Points, e.g. 10">
        <input class="e-field" id="pts-reason" placeholder="Reason">
        <button class="e-btn" id="pts-submit" style="background:var(--royal);">Award points</button>
      </div>

      <!-- Case feedback -->
      <div class="e-card">
        <p class="e-label">Case feedback</p>
        <div id="cf-msg" class="msg"></div>
        <select class="e-select" id="cf-member"></select>
        <input class="e-field" id="cf-event" placeholder="Event or role-play">
        <input class="e-field" id="cf-grade" placeholder="Grade, e.g. 88/100">
        <textarea class="e-field" id="cf-feedback" placeholder="What went well, what to improve..."></textarea>
        <button class="e-btn" id="cf-submit" style="background:var(--royal);">Send feedback</button>
      </div>

      <!-- Feedback inbox -->
      <div class="e-card e-card-wide">
        <p class="e-label">Feedback inbox <span id="inbox-label" style="color:var(--slate-dim);"></span></p>
        <div id="inbox-list"></div>
      </div>

    </div>
  </div>
</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import {
  auth, db, CLUSTERS, CLUSTER_META,
  doc, setDoc, getDoc, collection, addDoc, getDocs,
  query, orderBy, where, serverTimestamp,
  signOut, signInAnonymously,
  renderNav, showMsg, fmtDate
} from "/js/app.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

renderNav();

// logout
document.getElementById("exec-logout").addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href = "/index.html";
});

// check if already in exec mode
onAuthStateChanged(auth, async (user)=>{
  if(!user) return;
  const snap = await getDoc(doc(db, "execs", user.uid));
  if(snap.exists()){
    showPickerView();
  }
});

// ---- Gate ----
document.getElementById("gate-btn").addEventListener("click", async ()=>{
  const msg = document.getElementById("gate-msg");
  const code = document.getElementById("gate-code").value.trim();
  if(!code) return;
  try{
    if(!auth.currentUser) await signInAnonymously(auth);
    const uid = auth.currentUser.uid;
    const existing = await getDoc(doc(db, "execs", uid));
    if(!existing.exists()){
      await setDoc(doc(db, "execs", uid), { code, createdAt: serverTimestamp() });
    }
    showPickerView();
  } catch(err){
    showMsg(msg, "Incorrect code — check with your chapter advisor.", "error");
  }
});

function showPickerView(){
  document.getElementById("gate-view").classList.add("hidden");
  document.getElementById("picker-view").classList.remove("hidden");

  const grid = document.getElementById("picker-grid");
  grid.innerHTML = "";
  CLUSTERS.forEach(name=>{
    const meta = CLUSTER_META[name];
    if(!meta) return;
    const card = document.createElement("div");
    card.className = "e-pick-card";
    card.style.borderColor = "var(--border)";
    card.innerHTML = `
      <div style="width:52px;height:52px;border-radius:8px;background:${meta.color}22;border:1px solid ${meta.color}55;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;">
        <img src="${meta.badge}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'" alt="${name}">
      </div>
      <p class="e-pick-label">${name}</p>
    `;
    card.addEventListener("mouseenter", ()=> card.style.borderColor = meta.color);
    card.addEventListener("mouseleave", ()=> card.style.borderColor = "var(--border)");
    card.addEventListener("click", ()=> loadCluster(name, meta));
    grid.appendChild(card);
  });
}

let currentCluster = null;
let clusterMembers = [];

async function loadCluster(name, meta){
  currentCluster = name;
  document.getElementById("picker-view").classList.add("hidden");
  document.getElementById("dash-view").classList.remove("hidden");

  // tint
  document.getElementById("tint").style.background =
    `radial-gradient(900px 400px at 50% 0%, ${meta.color}40, transparent 65%)`;

  // header
  document.getElementById("d-badge-img").src = meta.badge;
  document.getElementById("d-badge").style.background = `${meta.color}22`;
  document.getElementById("d-name").textContent = name;
  document.getElementById("d-label").textContent = "Exec dashboard";
  document.getElementById("d-label").style.color = meta.color;
  document.getElementById("pts-submit").style.background = meta.color;
  document.getElementById("cf-submit").style.background = meta.color;
  document.getElementById("spot-submit").style.background = meta.color;
  document.getElementById("inbox-label").textContent = `· ${name} only`;

  // switcher
  const sw = document.getElementById("d-switcher");
  sw.innerHTML = "";
  CLUSTERS.forEach(n=>{
    const m = CLUSTER_META[n];
    if(!m) return;
    const dot = document.createElement("div");
    dot.className = "e-sw-dot" + (n===name ? " active" : "");
    dot.style.background = m.color;
    dot.title = n;
    dot.addEventListener("click", ()=> loadCluster(n, m));
    sw.appendChild(dot);
  });

  // load cluster points + rank
  const pSnap = await getDocs(collection(db, "points"));
  const totals = {};
  pSnap.forEach(d=>{
    const p = d.data();
    if(p.cluster) totals[p.cluster] = (totals[p.cluster]||0) + (Number(p.points)||0);
  });
  const ranked = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const myPts = totals[name]||0;
  const myRank = ranked.findIndex(([n])=>n===name)+1;
  document.getElementById("d-pts").innerHTML = `${myPts} <span style="font-size:14px;color:var(--slate);font-weight:400;">pts</span>`;
  document.getElementById("d-rank").style.color = myRank===1 ? "#7FDBA6" : "var(--slate)";
  document.getElementById("d-rank").textContent = myRank ? `Rank ${myRank} of ${ranked.length}` : "No points yet";

  // load cluster members into dropdowns
  const uSnap = await getDocs(query(collection(db,"users"), where("cluster","==",name)));
  clusterMembers = [];
  uSnap.forEach(d=> clusterMembers.push({ uid: d.id, name: d.data().name }));

  [document.getElementById("pts-member"), document.getElementById("cf-member")].forEach(sel=>{
    sel.innerHTML = clusterMembers.length
      ? clusterMembers.map(m=>`<option value="${m.uid}">${m.name}</option>`).join("")
      : `<option disabled>No members found</option>`;
  });

  // load current spotlight
  loadSpotlight();

  // load feedback inbox
  loadInbox(name);
}

// ---- Points scope toggle ----
document.getElementById("pts-scope").addEventListener("change", e=>{
  document.getElementById("pts-member").classList.toggle("hidden", e.target.value !== "individual");
});

// ---- Award points ----
document.getElementById("pts-submit").addEventListener("click", async ()=>{
  const msg = document.getElementById("points-msg");
  const scope = document.getElementById("pts-scope").value;
  const amount = Number(document.getElementById("pts-amount").value);
  const reason = document.getElementById("pts-reason").value.trim();
  if(!amount || !reason){ showMsg(msg,"Fill in points and reason.","error"); return; }

  let name = currentCluster;
  let uid = null;
  if(scope === "individual"){
    const sel = document.getElementById("pts-member");
    uid = sel.value;
    name = clusterMembers.find(m=>m.uid===uid)?.name || currentCluster;
  }

  try{
    await addDoc(collection(db,"points"),{
      scope, cluster: currentCluster,
      name, uid, points: amount, reason,
      createdAt: serverTimestamp()
    });
    showMsg(msg,"Points awarded — leaderboard updated.","success");
    document.getElementById("pts-amount").value = "";
    document.getElementById("pts-reason").value = "";
  } catch(err){
    showMsg(msg, err.message.replace("Firebase: ",""), "error");
  }
});

// ---- Reset cluster points to 0 ----
document.getElementById("reset-pts-btn").addEventListener("click", async ()=>{
  if(!currentCluster) return;

  const pSnap = await getDocs(collection(db, "points"));
  let total = 0;
  pSnap.forEach(d=>{
    const p = d.data();
    if(p.cluster === currentCluster) total += (Number(p.points)||0);
  });

  if(total === 0){
    alert("Already at 0.");
    return;
  }
  if(!confirm(`Reset ${currentCluster} from ${total} pts to 0? This adds an offsetting entry — it can't be undone from the UI.`)) return;

  try{
    await addDoc(collection(db,"points"),{
      scope: "cluster",
      cluster: currentCluster,
      name: currentCluster,
      uid: null,
      points: -total,
      reason: "Reset for testing",
      createdAt: serverTimestamp()
    });
    loadCluster(currentCluster, CLUSTER_META[currentCluster]);
  } catch(err){
    alert(err.message.replace("Firebase: ",""));
  }
});

// ---- Spotlight ----
document.getElementById("spot-toggle").addEventListener("click", ()=>{
  document.getElementById("spot-form-wrap").classList.toggle("hidden");
});

document.getElementById("spot-submit").addEventListener("click", async ()=>{
  const msg = document.getElementById("spot-msg");
  const name = document.getElementById("spot-name").value.trim();
  const note = document.getElementById("spot-note").value.trim();
  if(!name||!note){ showMsg(msg,"Fill in both fields.","error"); return; }
  try{
    await addDoc(collection(db,"spotlights"),{ name, note, createdAt: serverTimestamp() });
    showMsg(msg,"Spotlight posted.","success");
    document.getElementById("spot-name").value = "";
    document.getElementById("spot-note").value = "";
    document.getElementById("spot-form-wrap").classList.add("hidden");
    loadSpotlight();
  } catch(err){
    showMsg(msg, err.message.replace("Firebase: ",""), "error");
  }
});

async function loadSpotlight(){
  const el = document.getElementById("d-spot-current");
  const snap = await getDocs(query(
    collection(db,"spotlights"),
    orderBy("createdAt","desc")
  ));
  const items = [];
  snap.forEach(d=> items.push({ id: d.id, ...d.data() }));

  if(!items.length){
    el.innerHTML = `<p class="muted" style="font-size:12px;">No spotlights yet.</p>`;
    return;
  }
  el.innerHTML = items.map(s=>`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
      <div>
        <p style="font-size:13px;font-weight:600;color:#fff;margin:0;">${s.name}</p>
        <p style="font-size:12px;color:var(--slate);margin:2px 0 0;">${s.note}</p>
      </div>
      <button onclick="deleteSpot('${s.id}')" style="background:transparent;border:none;color:var(--crimson);font-size:11px;cursor:pointer;padding:0;margin-left:10px;white-space:nowrap;">Delete</button>
    </div>
  `).join("");
}

window.deleteSpot = async (id)=>{
  if(!confirm("Delete this spotlight?")) return;
  await deleteDoc(doc(db,"spotlights",id));
  loadSpotlight();
};

// ---- Case feedback ----
document.getElementById("cf-submit").addEventListener("click", async ()=>{
  const msg = document.getElementById("cf-msg");
  const sel = document.getElementById("cf-member");
  const memberName = sel.options[sel.selectedIndex]?.text || "";
  const event = document.getElementById("cf-event").value.trim();
  const grade = document.getElementById("cf-grade").value.trim();
  const feedback = document.getElementById("cf-feedback").value.trim();
  if(!memberName||!event||!grade||!feedback){ showMsg(msg,"Fill in all fields.","error"); return; }
  try{
    await addDoc(collection(db,"casefeedback"),{
      name: memberName, event, grade, feedback,
      cluster: currentCluster, createdAt: serverTimestamp()
    });
    showMsg(msg,"Feedback sent.","success");
    document.getElementById("cf-event").value = "";
    document.getElementById("cf-grade").value = "";
    document.getElementById("cf-feedback").value = "";
  } catch(err){
    showMsg(msg, err.message.replace("Firebase: ",""), "error");
  }
});

// ---- Feedback inbox ----
async function loadInbox(cluster){
  const el = document.getElementById("inbox-list");
  el.innerHTML = `<p class="muted" style="font-size:12px;">Loading...</p>`;
  try{
    const snap = await getDocs(query(
      collection(db,"feedback"),
      where("cluster","==",cluster),
      orderBy("createdAt","desc")
    ));
    const items = [];
    snap.forEach(d=> items.push(d.data()));
    if(!items.length){
      el.innerHTML = `<p class="muted" style="font-size:12px;">No feedback yet from ${cluster} members.</p>`;
      return;
    }
    el.innerHTML = items.map(f=>`
      <div class="e-inbox-row">
        <div>
          <p style="font-size:12.5px;font-weight:600;color:#fff;margin:0;">${f.anonymous ? "Anonymous" : (f.name || "Member")}</p>
          <p style="font-size:12px;color:var(--slate);margin:3px 0 0;">${f.message}</p>
        </div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--slate-dim);white-space:nowrap;margin-left:12px;">${fmtDate(f.createdAt)}</span>
      </div>
    `).join("");
  } catch(err){
    console.error("FEEDBACK LOAD ERROR:", err);
    el.innerHTML = `<p class="muted" style="font-size:12px;">Couldn't load feedback — check Firestore rules.</p>`;
}
}
</script>
</body>
</html>
