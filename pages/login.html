<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — DECA Chapter Hub</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<div class="page-narrow">
  <p class="eyebrow">Member Account</p>
  <h1 class="title">Log in</h1>
  <p class="lede">Members log in with their school email. Execs, use the <a href="exec.html" style="color:var(--crimson); font-weight:600;">exec login</a> instead.</p>

  <div class="card">
    <div id="msg" class="msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">School email</label>
        <input type="email" id="email" required placeholder="you@school.edu">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
    <p class="muted mt center">No account yet? <a href="signup.html" style="color:var(--navy); font-weight:600;">Sign up</a></p>
  </div>
</div>

<footer>DECA Chapter Hub — built for members, by members.</footer>

<script type="module">
import { auth, signInWithEmailAndPassword, renderNav, showMsg } from "../js/app.js";

renderNav("");

const form = document.getElementById("login-form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try{
    await signInWithEmailAndPassword(auth, email, password);
    showMsg(msg, "Logged in! Redirecting...", "success");
    setTimeout(()=> window.location.href = "../index.html", 700);
  } catch(err){
    showMsg(msg, err.message.replace("Firebase: ",""), "error");
  }
});
</script>
</body>
</html>
